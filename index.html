<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE RAY'S · Samarsingh Lineage Interface</title>

<!-- Tailwind (Play CDN) — utilities available; all critical visuals are in custom CSS below so it works offline too -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + Babel (single-file, no build step) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Force the CLASSIC JSX runtime (React.createElement) so the inline script needs no ES-module imports -->
<script>
  Babel.registerPreset("react-classic", {
    presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],

<!-- Techy display fonts (graceful fallback to system if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#05070d;
    --bg2:#080d17;
    --cyan:#38e6ff;
    --cyan-deep:#0bb6e6;
    --cyan-dim:rgba(56,230,255,.28);
    --magenta:#ff5cae;
    --magenta-dim:rgba(255,92,174,.30);
    --glass:rgba(9,17,28,.55);
    --line:rgba(56,230,255,.22);
    --text:#dbf3ff;
    --muted:#7fa7bd;
  }

  *{ box-sizing:border-box; }
  html,body,#root{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani','Chakra Petch',system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Ambient obsidian background ---------- */
  .stage{ position:fixed; inset:0; overflow:hidden; }
  .bg-layer{ position:absolute; inset:0; pointer-events:none; }
  .bg-radial{
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(30,120,160,.22), transparent 60%),
      radial-gradient(900px 900px at 12% 110%, rgba(20,90,140,.16), transparent 60%),
      radial-gradient(900px 900px at 92% 8%, rgba(120,30,90,.10), transparent 55%),
      linear-gradient(180deg,#05070d, #04060b 60%, #03040a);
  }
  .bg-grid{
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:46px 46px;
    opacity:.16;
    mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 85%);
  }
  .bg-scan{
    background:repeating-linear-gradient(0deg, rgba(56,230,255,.05) 0 1px, transparent 1px 4px);
    opacity:.5; mix-blend-mode:screen;
    animation:scan 12s linear infinite;
  }
  @keyframes scan{ from{ transform:translateY(-4px);} to{ transform:translateY(4px);} }
  .bg-vignette{ box-shadow:inset 0 0 320px 60px rgba(0,0,0,.85); }

  .particle{ position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 10px 2px var(--cyan); opacity:.5;
    animation:float linear infinite; }
  @keyframes float{
    0%{ transform:translateY(0); opacity:0; }
    12%{ opacity:.55; }
    100%{ transform:translateY(-120vh); opacity:0; }
  }

  /* ---------- HUD frame ---------- */
  .hud-corner{ position:fixed; width:64px; height:64px; border:2px solid var(--cyan-dim);
    z-index:40; pointer-events:none; filter:drop-shadow(0 0 6px var(--cyan-dim)); }
  .hud-tl{ top:14px; left:14px; border-right:0; border-bottom:0; }
  .hud-tr{ top:14px; right:14px; border-left:0; border-bottom:0; }
  .hud-bl{ bottom:14px; left:14px; border-right:0; border-top:0; }
  .hud-br{ bottom:14px; right:14px; border-left:0; border-top:0; }

  .topbar{ position:fixed; top:0; left:0; right:0; z-index:35; padding:20px 30px 8px;
    display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none; }
  .brand{ pointer-events:none; }
  .brand h1{
    font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:.14em;
    font-size:30px; margin:0; line-height:1;
    color:#eafcff;
    text-shadow:0 0 18px rgba(56,230,255,.55), 0 0 3px rgba(56,230,255,.9);
  }
  .brand .sub{ margin-top:6px; font-family:'Chakra Petch'; letter-spacing:.42em;
    font-size:11px; color:var(--muted); text-transform:uppercase; }
  .brand .sub b{ color:var(--cyan); font-weight:600; }

  .statchip{
    pointer-events:auto;
    font-family:'Chakra Petch'; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); background:var(--glass); border:1px solid var(--line);
    padding:8px 14px; border-radius:10px; backdrop-filter:blur(8px);
    box-shadow:0 0 22px rgba(0,0,0,.5), inset 0 0 18px rgba(56,230,255,.06);
    display:flex; gap:14px; align-items:center;
  }
  .statchip b{ color:var(--cyan); font-weight:600; }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 10px 2px var(--cyan); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.35;} 50%{opacity:1;} }

  /* ---------- Canvas / viewport ---------- */
  .viewport{ position:fixed; inset:0; z-index:10; cursor:grab; touch-action:none; }
  .viewport.grabbing{ cursor:grabbing; }
  .canvas{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }

  .edges{ position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
  .edge{ stroke:var(--cyan); stroke-width:1.4; fill:none; opacity:.55;
    filter:drop-shadow(0 0 3px rgba(56,230,255,.7)); }
  .edge-f{ stroke:var(--magenta); opacity:.5; filter:drop-shadow(0 0 3px rgba(255,92,174,.6)); }
  .edge-flow{ stroke-dasharray:5 9; animation:flow 1.1s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-14; } }
  .union-dot{ fill:#06111a; stroke:var(--cyan); stroke-width:1.4;
    filter:drop-shadow(0 0 6px var(--cyan)); }

  .genband{ position:absolute; left:0; font-family:'Chakra Petch'; font-size:11px;
    letter-spacing:.35em; color:rgba(127,167,189,.55); text-transform:uppercase;
    pointer-events:none; }
  .genline{ position:absolute; left:0; height:1px;
    background:linear-gradient(90deg, rgba(56,230,255,.20), transparent);
    pointer-events:none; }

  /* ---------- Person node ---------- */
  .node{ position:absolute; }
  .card{
    position:relative; width:100%; height:100%;
    background:linear-gradient(180deg, rgba(12,24,36,.85), rgba(7,14,22,.9));
    border:1px solid var(--cyan-dim); border-radius:12px;
    backdrop-filter:blur(6px);
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.55),
               inset 0 0 22px rgba(56,230,255,.05);
    overflow:hidden; cursor:pointer;
    transition:transform .18s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card.f{ border-color:var(--magenta-dim); box-shadow:0 0 0 1px rgba(0,0,0,.4),
      0 8px 26px rgba(0,0,0,.55), inset 0 0 22px rgba(255,92,174,.05); }
  .card:hover{ transform:translateY(-4px);
    border-color:var(--cyan);
    box-shadow:0 0 24px rgba(56,230,255,.45), 0 10px 30px rgba(0,0,0,.6),
               inset 0 0 26px rgba(56,230,255,.12); }
  .card.f:hover{ border-color:var(--magenta);
    box-shadow:0 0 24px rgba(255,92,174,.4), 0 10px 30px rgba(0,0,0,.6),
               inset 0 0 26px rgba(255,92,174,.12); }
  .card.sel{ border-color:#eafcff;
    box-shadow:0 0 30px rgba(56,230,255,.7), inset 0 0 30px rgba(56,230,255,.18); }
  .card.dim{ opacity:.28; filter:grayscale(.5); }

  .card .corner{ position:absolute; width:9px; height:9px; border:1.5px solid var(--cyan);
    opacity:.8; }
  .card.f .corner{ border-color:var(--magenta); }
  .c-tl{ top:5px; left:5px; border-right:0; border-bottom:0; }
  .c-tr{ top:5px; right:5px; border-left:0; border-bottom:0; }
  .c-bl{ bottom:5px; left:5px; border-right:0; border-top:0; }
  .c-br{ bottom:5px; right:5px; border-left:0; border-top:0; }

  .photo-wrap{ position:relative; height:112px; overflow:hidden;
    border-bottom:1px solid var(--cyan-dim);
    background:radial-gradient(circle at 50% 40%, rgba(56,230,255,.12), rgba(4,8,14,.9)); }
  .card.f .photo-wrap{ border-bottom-color:var(--magenta-dim); }
  .photo-wrap img{ width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(1.05) contrast(1.03); }
  .photo-wrap .scanline{ position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
    mix-blend-mode:multiply; opacity:.5; pointer-events:none; }
  .avatar-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron'; font-weight:700; font-size:30px; color:var(--cyan);
    text-shadow:0 0 14px rgba(56,230,255,.6); letter-spacing:.04em; }
  .card.f .avatar-fallback{ color:var(--magenta); text-shadow:0 0 14px rgba(255,92,174,.6); }

  .name-bar{ padding:7px 8px 8px; text-align:center; }
  .name-bar .nm{ font-family:'Rajdhani'; font-weight:600; font-size:13px; line-height:1.05;
    color:#eafcff; letter-spacing:.01em; }
  .name-bar .role{ margin-top:2px; font-family:'Chakra Petch'; font-size:8.5px;
    letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }

  /* ---------- Controls ---------- */
  .controls{ position:fixed; right:22px; bottom:22px; z-index:38; display:flex; flex-direction:column;
    gap:8px; }
  .ctl{ width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    background:var(--glass); border:1px solid var(--line); border-radius:11px;
    color:var(--cyan); font-size:19px; cursor:pointer; backdrop-filter:blur(8px);
    box-shadow:0 0 18px rgba(0,0,0,.5), inset 0 0 14px rgba(56,230,255,.06);
    font-family:'Orbitron'; transition:.15s; user-select:none; }
  .ctl:hover{ border-color:var(--cyan); color:#eafcff; box-shadow:0 0 20px rgba(56,230,255,.4); }
  .ctl small{ font-family:'Chakra Petch'; font-size:9px; letter-spacing:.1em; }

  .searchwrap{ position:fixed; left:30px; bottom:24px; z-index:38; width:270px; }
  .searchbox{ display:flex; align-items:center; gap:8px; background:var(--glass);
    border:1px solid var(--line); border-radius:12px; padding:9px 12px; backdrop-filter:blur(8px);
    box-shadow:0 0 20px rgba(0,0,0,.5), inset 0 0 16px rgba(56,230,255,.05); }
  .searchbox input{ background:transparent; border:0; outline:0; color:var(--text);
    font-family:'Rajdhani'; font-size:14px; width:100%; letter-spacing:.02em; }
  .searchbox input::placeholder{ color:var(--muted); }
  .searchbox .ico{ color:var(--cyan); font-size:15px; }
  .results{ margin-top:8px; max-height:230px; overflow:auto; border-radius:12px;
    background:rgba(6,12,20,.92); border:1px solid var(--line); backdrop-filter:blur(10px);
    box-shadow:0 12px 34px rgba(0,0,0,.6); }
  .results button{ display:flex; width:100%; text-align:left; gap:10px; align-items:center;
    background:transparent; border:0; border-bottom:1px solid rgba(56,230,255,.08);
    color:var(--text); padding:8px 12px; cursor:pointer; font-family:'Rajdhani'; font-size:13px; }
  .results button:hover{ background:rgba(56,230,255,.10); color:#eafcff; }
  .results .rk{ font-size:10px; color:var(--muted); font-family:'Chakra Petch'; letter-spacing:.12em; }

  /* ---------- Detail panel ---------- */
  .panel{ position:fixed; top:0; right:0; height:100%; width:360px; z-index:45;
    background:linear-gradient(160deg, rgba(8,16,26,.92), rgba(5,9,16,.96));
    border-left:1px solid var(--cyan-dim); backdrop-filter:blur(16px);
    box-shadow:-20px 0 60px rgba(0,0,0,.6); padding:78px 24px 24px;
    transform:translateX(102%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto; }
  .panel.open{ transform:translateX(0); }
  .panel .close{ position:absolute; top:22px; right:22px; width:34px; height:34px; border-radius:9px;
    border:1px solid var(--line); background:transparent; color:var(--cyan); cursor:pointer; font-size:16px; }
  .panel .close:hover{ border-color:var(--cyan); color:#fff; }
  .panel .p-photo{ width:150px; height:150px; margin:0 auto 16px; border-radius:16px; overflow:hidden;
    border:1px solid var(--cyan-dim); box-shadow:0 0 34px rgba(56,230,255,.28);
    background:radial-gradient(circle,rgba(56,230,255,.14),rgba(4,8,14,.9)); }
  .panel .p-photo img{ width:100%; height:100%; object-fit:cover; }
  .panel .p-photo .avatar-fallback{ font-size:52px; }
  .panel .p-name{ text-align:center; font-family:'Orbitron'; font-weight:700; font-size:20px;
    color:#eafcff; letter-spacing:.06em; text-shadow:0 0 16px rgba(56,230,255,.4); }
  .panel .p-gen{ text-align:center; margin-top:5px; font-family:'Chakra Petch'; font-size:11px;
    letter-spacing:.28em; text-transform:uppercase; color:var(--cyan); }
  .panel .sect{ margin-top:20px; }
  .panel .sect h4{ font-family:'Chakra Petch'; font-size:10.5px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin:0 0 9px; padding-bottom:6px; border-bottom:1px solid rgba(56,230,255,.14); }
  .relrow{ display:flex; flex-wrap:wrap; gap:7px; }
  .reltag{ font-family:'Rajdhani'; font-size:13px; color:var(--text); background:rgba(56,230,255,.08);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; transition:.15s; }
  .reltag:hover{ background:rgba(56,230,255,.18); color:#eafcff; border-color:var(--cyan); }
  .reltag.f{ background:rgba(255,92,174,.08); border-color:var(--magenta-dim); }
  .reltag.f:hover{ background:rgba(255,92,174,.18); border-color:var(--magenta); }
  .empty{ color:var(--muted); font-size:12px; font-family:'Chakra Petch'; letter-spacing:.1em; }

  .hint{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30;
    font-family:'Chakra Petch'; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(127,167,189,.6); pointer-events:none; }
  .hint b{ color:var(--cyan); }

  /* Boot animation */
  /* NOTE: only animate opacity here — animating `transform` would override the
     inline pan/zoom transform on .canvas (CSS animations beat inline styles). */
  .boot{ animation:boot 1s ease both; }
  @keyframes boot{ from{ opacity:0; } to{ opacity:1; } }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(56,230,255,.25); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>

<script type="text/babel" data-presets="react-classic">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

/* ============================================================================
   1. DATA MODEL  ·  The Ray's / Samarsingh lineage
   Each person: { name, gender:'m'|'f', photo?: exact filename in "Family Tree Photos" }
   Each node: { person, spouse?, children?: node[] }
   The `photo` field is the EXACT file name mapping requested in the brief.
   ==========================================================================*/
const PHOTO_DIR = "Family Tree Photos";

const P = (name, gender, photo) => ({ name, gender, photo: photo || null });

const FAMILY = {

    {

          children: [ { person: P("Sumay Ray", "m") } ] },
      ],
    },
    /* 4 ── Sahadev / Anjali line */
    {
      person: P("Sahadev Nayak", "m", "Shahadev Nayak.png"),
      spouse: P("Anjali Nayak", "f", "Anjali Nayak.png"),
      children: [
        { person: P("Abhijit Nayak", "m", "Abhijit Nayak.jpg") },
        { person: P("Animesh Nayak", "m", "Animesh Nayak.png"), spouse: P("Pratima Nayak", "f", "Juli Nayak.png"),
          children: [ { person: P("Neevan Nayak", "m", "Child of Animesh.png") } ] },
        { person: P("Anup Sahoo", "m", "Anup Sahoo.png"), spouse: P("Shubhashree Nayak", "f", "Shubhashree Nayak.jpeg"),

    {

    {

        { person: P("Adarsh Ray", "m", "Adarsh Ray.png"), spouse: P("Mitali Mohapatra", "f", "Mitali Mohapatra.png") },

    {

    {

      children: [

    {
      person: P("Amulya Jena", "m", "Amulya Jena.png"),

      children: [
        { person: P("Arman Jena", "m", "Arman Jena.png"), spouse: P("Swati Das", "f", "Swati Das.png") },

      ],
    },
  ],
};

const photoURL = (p) => p && p.photo ? encodeURI(PHOTO_DIR + "/" + p.photo) : null;
const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const GEN_LABEL = ["Founders", "Second Generation", "Third Generation", "Fourth Generation"];

/* ============================================================================
   2. LAYOUT ENGINE  ·  tidy top-down tree with couples + orthogonal connectors
   ==========================================================================*/
const CARD_W = 126, CARD_H = 168, COUPLE_GAP = 24, H_GAP = 30, V_GAP = 250, PAD = 140;

function buildLayout(root){
  let uid = 0;
  const nodes = [];   // positioned unions
  const edges = [];   // { d, gender?, flow? }

  const unitW = n => n.spouse ? CARD_W*2 + COUPLE_GAP : CARD_W;

  function measure(n){
    const uw = unitW(n);
    if(!n.children || !n.children.length){ n._w = uw; return uw; }
    let cw = 0;
    n.children.forEach((c,i)=>{ cw += measure(c); if(i) cw += H_GAP; });
    n._w = Math.max(uw, cw);
    return n._w;
  }
  function assign(n, left, depth, parent){
    n._id = uid++; n._depth = depth; n._parent = parent;
    n._cx = left + n._w/2;
    n._y  = PAD + depth * V_GAP;
    if(n.children && n.children.length){
      let tot = 0;
      n.children.forEach((c,i)=>{ tot += c._w; if(i) tot += H_GAP; });
      let cl = n._cx - tot/2;
      n.children.forEach(c=>{ assign(c, cl, depth+1, n); cl += c._w + H_GAP; });
    }
  }
  measure(root);
  assign(root, PAD, 0, null);

  let maxDepth = 0;
  (function collect(n){
    maxDepth = Math.max(maxDepth, n._depth);
    // card rectangles for this union
    const cards = [];
    if(n.spouse){
      cards.push({ person:n.person, x:n._cx - COUPLE_GAP/2 - CARD_W, y:n._y });
      cards.push({ person:n.spouse, x:n._cx + COUPLE_GAP/2,          y:n._y });
    } else {
      cards.push({ person:n.person, x:n._cx - CARD_W/2, y:n._y });
    }
    nodes.push({ id:n._id, depth:n._depth, cx:n._cx, y:n._y, cards, ref:n });

    // marriage connector
    if(n.spouse){
      const my = n._y + CARD_H/2;
      const lx = n._cx - COUPLE_GAP/2, rx = n._cx + COUPLE_GAP/2;
      edges.push({ d:`M ${n._cx-COUPLE_GAP/2-1} ${my} H ${n._cx+COUPLE_GAP/2+1}`, gender:"f", marriage:true });
    }

    // parent → children bus
    if(n.children && n.children.length){
      const py = n._y + CARD_H;
      const busY = n._y + CARD_H + (V_GAP - CARD_H) * 0.42;
      edges.push({ d:`M ${n._cx} ${py} V ${busY}`, flow:true });               // trunk
      const cxs = n.children.map(c=>c._cx);
      const minx = Math.min(...cxs), maxx = Math.max(...cxs);
      if(n.children.length > 1) edges.push({ d:`M ${minx} ${busY} H ${maxx}` }); // bus
      n.children.forEach(c=>{ edges.push({ d:`M ${c._cx} ${busY} V ${c._y}`, flow:true }); }); // drops
      n.children.forEach(collect);
    }
  })(root);

  const width  = root._w + PAD*2;
  const height = PAD + (maxDepth+1)*V_GAP + CARD_H*0.4;
  return { nodes, edges, width, height, maxDepth };
}

/* Flatten to a searchable person index with relationship context */
function indexPeople(nodes){
  const list = [];
  const byId = {};
  nodes.forEach(u => byId[u.id] = u);
  nodes.forEach(u=>{
    const gen = u.depth;
    const parentU = u.ref._parent ? byId[u.ref._parent._id] : null;
    u.cards.forEach(card=>{
      const partner = u.cards.find(c=>c !== card);
      list.push({
        person: card.person,
        union: u,
        gen,
        cardX: card.x, cardY: card.y,
        spouse: partner ? partner.person : null,
        parents: parentU ? parentU.cards.map(c=>c.person) : [],
        children: (u.ref.children||[]).map(c=>c.person),
      });
    });
  });
  return list;
}

/* ============================================================================
   3. COMPONENTS
   ==========================================================================*/
function Avatar({ person, big }){
  const url = photoURL(person);
  const [err, setErr] = useState(false);
  if(url && !err){
    return React.createElement("img",{ src:url, alt:person.name, loading:"lazy",
      onError:()=>setErr(true) });
  }
  return <div className="avatar-fallback">{initials(person.name)}</div>;
}

function PersonCard({ card, selectedName, matchNames, onSelect }){
  const p = card.person;
  const isSel = selectedName === p.name;
  const dim = matchNames && !matchNames.has(p.name);
  const cls = ["card", p.gender==="f"?"f":"", isSel?"sel":"", dim?"dim":""].join(" ").trim();
  return (
    <div className="node" style={{ left:card.x, top:card.y, width:CARD_W, height:CARD_H }}>
      <div className={cls} data-name={p.name}>
        <span className="corner c-tl"/><span className="corner c-tr"/>
        <span className="corner c-bl"/><span className="corner c-br"/>
        <div className="photo-wrap">
          <Avatar person={p} />
          <div className="scanline" />
        </div>
        <div className="name-bar">
          <div className="nm">{p.name}</div>
          <div className="role">{p.gender==="f"?"◈ Lineage":"◈ Lineage"}</div>
        </div>
      </div>
    </div>
  );
}

function Edges({ edges, width, height }){
  return (
    <svg className="edges" width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      {edges.map((e,i)=>(
        <path key={i} d={e.d}
          className={["edge", e.gender==="f"?"edge-f":"", e.flow?"edge-flow":""].join(" ").trim()} />
      ))}
    </svg>
  );
}

function DetailPanel({ entry, onClose, onSelect }){
  const open = !!entry;
  const p = entry ? entry.person : null;
  return (
    <div className={"panel" + (open?" open":"")}>
      <button className="close" onClick={onClose}>✕</button>
      {entry && (
        <React.Fragment>
          <div className="p-photo"><Avatar person={p} big /></div>
          <div className="p-name">{p.name}</div>
          <div className="p-gen">{GEN_LABEL[entry.gen] || ("Gen " + (entry.gen+1))}</div>

          <div className="sect">
            <h4>Spouse</h4>
            {entry.spouse
              ? <div className="relrow"><span className={"reltag"+(entry.spouse.gender==="f"?" f":"")}
                    onClick={()=>onSelect(entry.spouse.name)}>{entry.spouse.name}</span></div>
              : <div className="empty">— none on record —</div>}
          </div>

          <div className="sect">
            <h4>Parents</h4>
            {entry.parents.length
              ? <div className="relrow">{entry.parents.map(pr=>(
                  <span key={pr.name} className={"reltag"+(pr.gender==="f"?" f":"")}
                    onClick={()=>onSelect(pr.name)}>{pr.name}</span>))}</div>
              : <div className="empty">— root of lineage —</div>}
          </div>

          <div className="sect">
            <h4>Children</h4>
            {entry.children.length
              ? <div className="relrow">{entry.children.map(ch=>(
                  <span key={ch.name} className={"reltag"+(ch.gender==="f"?" f":"")}
                    onClick={()=>onSelect(ch.name)}>{ch.name}</span>))}</div>
              : <div className="empty">— none on record —</div>}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function Particles(){
  const items = useMemo(()=> Array.from({length:26}, ()=>({
    left: Math.random()*100,
    dur: 14 + Math.random()*22,
    delay: -Math.random()*30,
    size: 1 + Math.random()*2.5,
    op: .25 + Math.random()*.5,
  })), []);
  return (
    <div className="bg-layer">
      {items.map((p,i)=>(
        <span key={i} className="particle" style={{
          left:p.left+"%", bottom:"-10px", width:p.size, height:p.size,
          opacity:p.op, animationDuration:p.dur+"s", animationDelay:p.delay+"s" }} />
      ))}
    </div>
  );
}

/* ============================================================================
   4. APP  ·  pan / zoom / search / focus
   ==========================================================================*/
function App(){
  const layout = useMemo(()=> buildLayout(FAMILY), []);
  const people = useMemo(()=> indexPeople(layout.nodes), [layout]);
  const byName = useMemo(()=>{ const m={}; people.forEach(e=>m[e.person.name]=e); return m; }, [people]);

  const [view, setView] = useState({ x:0, y:0, k:1 });
  const [selected, setSelected] = useState(null);      // name
  const [query, setQuery] = useState("");
  const vpRef = useRef(null);
  const drag = useRef(null);

  // Fit tree to viewport on load
  const fit = useCallback(()=>{
    const vp = vpRef.current; if(!vp) return;
    const w = vp.clientWidth, h = vp.clientHeight;
    if(w <= 0 || h <= 0) return;                       // viewport not laid out yet
    const k = Math.min(w/layout.width, h/layout.height) * 0.92;
    if(!isFinite(k) || k <= 0) return;
    const x = (w - layout.width*k)/2;
    const y = (h - layout.height*k)/2 + 24;
    setView({ x, y, k });
  }, [layout]);

  // Robustly fit once the viewport has real dimensions, and re-fit on resize
  useEffect(()=>{
    let raf;
    const tryFit = (attempt=0)=>{
      const vp = vpRef.current;
      if(vp && vp.clientWidth > 0 && vp.clientHeight > 0){ fit(); }
      else if(attempt < 30){ raf = requestAnimationFrame(()=>tryFit(attempt+1)); }
    };
    raf = requestAnimationFrame(()=>tryFit());
    const onResize = ()=> fit();
    window.addEventListener("resize", onResize);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener("resize", onResize); };
  }, [fit]);

  // Center the view on a given person (used by search + relation clicks)
  const focusOn = useCallback((name)=>{
    const e = byName[name]; if(!e) return;
    setSelected(name);
    const vp = vpRef.current; if(!vp) return;
    const w = vp.clientWidth, h = vp.clientHeight;
    const k = Math.max(view.k, 0.85);
    const cx = e.cardX + CARD_W/2, cy = e.cardY + CARD_H/2;
    setView({ x: w/2 - cx*k - 140, y: h/2 - cy*k, k });
  }, [byName, view.k]);

  // Wheel zoom toward cursor
  const onWheel = useCallback((ev)=>{
    ev.preventDefault();
    const vp = vpRef.current; const rect = vp.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    setView(v=>{
      const factor = ev.deltaY < 0 ? 1.12 : 1/1.12;
      const k = Math.min(2.4, Math.max(0.18, v.k * factor));
      const x = mx - (mx - v.x) * (k/v.k);
      const y = my - (my - v.y) * (k/v.k);
      return { x, y, k };
    });
  }, []);

  const onPointerDown = (ev)=>{
    const cardEl = ev.target.closest ? ev.target.closest(".card") : null;
    drag.current = { sx:ev.clientX, sy:ev.clientY, ox:view.x, oy:view.y, moved:false,
                     name: cardEl ? cardEl.getAttribute("data-name") : null };
    ev.currentTarget.setPointerCapture(ev.pointerId);
  };
  const onPointerMove = (ev)=>{
    if(!drag.current) return;
    const dx = ev.clientX - drag.current.sx, dy = ev.clientY - drag.current.sy;
    if(Math.abs(dx)+Math.abs(dy) > 5) drag.current.moved = true;
    setView(v=>({ ...v, x:drag.current.ox+dx, y:drag.current.oy+dy }));
  };
  const onPointerUp = (ev)=>{
    const d = drag.current; drag.current = null;
    if(!d || d.moved) return;                 // a drag/pan — do not change selection
    if(d.name) setSelected(d.name);            // tapped a node → open its dossier
    else setSelected(null);                    // tapped empty space → clear
  };

  const zoomBtn = (dir)=> setView(v=>{
    const vp = vpRef.current; const w=vp.clientWidth/2, h=vp.clientHeight/2;
    const k = Math.min(2.4, Math.max(0.18, v.k * (dir>0?1.2:1/1.2)));
    return { x: w-(w-v.x)*(k/v.k), y:h-(h-v.y)*(k/v.k), k };
  });

  // Search results
  const results = useMemo(()=>{
    const q = query.trim().toLowerCase();
    if(!q) return [];
    return people.filter(e=>e.person.name.toLowerCase().includes(q)).slice(0,8);
  }, [query, people]);

  const matchNames = useMemo(()=>{
    const q = query.trim().toLowerCase();
    if(!q) return null;
    const s = new Set();
    people.forEach(e=>{ if(e.person.name.toLowerCase().includes(q)) s.add(e.person.name); });
    return s;
  }, [query, people]);

  const selectedEntry = selected ? byName[selected] : null;

  return (
    <React.Fragment>
      {/* Ambient background */}
      <div className="stage">
        <div className="bg-layer bg-radial" />
        <div className="bg-layer bg-grid" />
        <Particles />
        <div className="bg-layer bg-scan" />
        <div className="bg-layer bg-vignette" />
      </div>

      {/* HUD */}
      <div className="hud-corner hud-tl" /><div className="hud-corner hud-tr" />
      <div className="hud-corner hud-bl" /><div className="hud-corner hud-br" />

      <div className="topbar">
        <div className="brand">
          <h1>THE RAY&rsquo;S</h1>
          <div className="sub">Lineage Interface · <b>House of Samarsingh</b></div>
        </div>
        <div className="statchip">
          <span className="live-dot" />
          <span>Members <b>{people.length}</b></span>
          <span>Generations <b>{layout.maxDepth+1}</b></span>
          <span>Zoom <b>{Math.round(view.k*100)}%</b></span>
        </div>
      </div>

      {/* Interactive canvas */}
      <div
        ref={vpRef}
        className={"viewport" + (drag.current ? " grabbing":"")}
        onWheel={onWheel}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
      >
        <div className="canvas boot"
          style={{ width:layout.width, height:layout.height,
                   transform:`translate(${view.x}px,${view.y}px) scale(${view.k})` }}>
          <Edges edges={layout.edges} width={layout.width} height={layout.height} />

          {/* generation guide bands */}
          {GEN_LABEL.slice(0, layout.maxDepth+1).map((lbl,i)=>(
            <React.Fragment key={i}>
              <div className="genband" style={{ top: PAD + i*V_GAP - 22, left: 12 }}>{`G${i+1} · ${lbl}`}</div>
              <div className="genline" style={{ top: PAD + i*V_GAP - 6, width: layout.width }} />
            </React.Fragment>
          ))}

          {layout.nodes.flatMap(u => u.cards.map((card,ci)=>(
            <PersonCard key={u.id+"-"+ci} card={card}
              selectedName={selected} matchNames={matchNames}
              onSelect={focusOn} />
          )))}
        </div>
      </div>

      {/* Search */}
      <div className="searchwrap">
        {results.length>0 && (
          <div className="results">
            {results.map(e=>(
              <button key={e.person.name} onClick={()=>{ focusOn(e.person.name); setQuery(""); }}>
                <span>{e.person.name}</span>
                <span className="rk" style={{marginLeft:"auto"}}>{`G${e.gen+1}`}</span>
              </button>
            ))}
          </div>
        )}
        <div className="searchbox">
          <span className="ico">⌕</span>
          <input value={query} onChange={e=>setQuery(e.target.value)}
            placeholder="Search a family member…" />
        </div>
      </div>

      {/* Controls */}
      <div className="controls">
        <div className="ctl" onClick={()=>zoomBtn(1)}>+</div>
        <div className="ctl" onClick={()=>zoomBtn(-1)}>−</div>
        <div className="ctl" onClick={fit} title="Fit"><small>FIT</small></div>
      </div>

      <div className="hint">Drag to <b>pan</b> · Scroll to <b>zoom</b> · Click a node for <b>details</b></div>

      <DetailPanel entry={selectedEntry} onClose={()=>setSelected(null)} onSelect={focusOn} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
